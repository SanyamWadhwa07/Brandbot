[project]
name = "brandbot"
version = "1.0.0"
description = "A grounded customer-support agent for one Twitter brand, and the evidence that it works."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sanyam Wadhwa", email = "swadhwa1_be23@thapar.edu" }]

dependencies = [
    "groq>=0.20",
    "google-genai>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "typer>=0.15",
    "rich>=13.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# Only needed to rebuild the committed subsample from the raw Kaggle corpus.
fetch = ["kagglehub>=0.3"]

[project.scripts]
brandbot = "brandbot.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brandbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
